name: CI

on:
  push:
    branches: [master, agent/opencode-tool-bridge]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check imports
        run: python -c "from chatgpt_web2api import __version__; from chatgpt_web2api.mcp_server import create_server; from chatgpt_web2api.opencode_bridge import create_app; from chatgpt_web2api.opencode_setup import parser; print('OK v' + __version__)"
      - name: Ruff (E/F/I/UP)
        run: ruff check src/ tests/
      - name: Validate Unix bootstrap syntax
        run: sh -n scripts/setup-opencode.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks scan
        run: gitleaks detect --source . --redact --verbose

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v -m "not e2e"
      - name: Parse and dry-run Windows bootstrap
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/setup-opencode.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/setup-opencode.ps1 -DryRun

  build:
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Check package
        run: |
          pip install dist/*.whl
          chatgpt-web2api --help
          chatgpt-web2api-mcp --help
          chatgpt-web2api-opencode --help
          chatgpt-web2api-opencode setup --help
